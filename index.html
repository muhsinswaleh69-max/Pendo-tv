<!-- PLAYER WITH SOUND -->
<div class="relative aspect-video bg-[#111] overflow-hidden" id="playerBox">
<iframe id="liveFrame" class="w-full h-full" src="https://www.youtube.com/embed/86YLFOog4GM?enablejsapi=1&mute=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

<!-- UNMUTE OVERLAY - Click to hear Rose Muhando -->
<div id="unmuteOverlay" onclick="unmuteTV()" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center cursor-pointer">
<p class="text-white text-4xl">🔊</p>
<p class="text-white font-black text-[16px] mt-2">TAP TO HEAR GOSPEL</p>
<p class="text-yellow-400 text-[11px] mt-1">Bonyeza hapa usikie Rose Muhando</p>
<button class="mt-3 bg-yellow-500 text-black font-black px-6 py-2 rounded-full text-[13px]">🎵 UNMUTE PENDO TV</button>
</div>

<div class="absolute top-2 left-2 flex gap-1"><span class="bg-red-600 text-white text-[10px] font-black px-2">LIVE</span><span class="bg-yellow-500 text-black text-[10px] font-black px-2">CHRISTIAN TV</span></div>
</div>

<script>
function unmuteTV(){
document.getElementById('unmuteOverlay').style.display='none';
let f=document.getElementById('liveFrame');
f.src=f.src+'&autoplay=1';
}
</script>
